<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <!-- Resource hints for map assets -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://events.mapbox.com" crossorigin />
    <!-- Resource hints for CDN scripts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peskas Tracks</title>
    
    <!-- PWA Meta Tags (the web app manifest is generated by vite-plugin-pwa in vite.config.ts) -->
    <meta name="description" content="Track and monitor fishing vessel activities" />
    <meta name="application-name" content="Peskas Tracks" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Peskas Tracks" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon configuration (brand kit in peskas-context/brand) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews: the card is public/og.png, 1200x630 -->
    <meta property="og:title" content="Peskas Tracks" />
    <meta property="og:description" content="Trips, catch and fishing grounds, for fishers" />
    <meta property="og:site_name" content="Peskas Tracks" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tracks.peskas.org/" />
    <meta property="og:image" content="https://tracks.peskas.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Peskas Tracks" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Bootstrap JavaScript for dropdowns and other interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" defer></script>
    <script>
      // Defer analytics load until after window load
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P955670NBN');

      window.addEventListener('load', () => {
        const gtmScript = document.createElement('script');
        gtmScript.async = true;
        gtmScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-P955670NBN';
        document.head.appendChild(gtmScript);

        // Register Service Worker after other work is done
        const registerSw = () => {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
              .then(() => console.log('ServiceWorker registration successful'))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          }
        };

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(registerSw);
        } else {
          setTimeout(registerSw, 2000);
        }
      });
    </script>
  </body>
</html>
